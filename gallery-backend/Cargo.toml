[package]
name = "urocissa"
version = "3.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = true

[profile.dev-release]
inherits = "release"
lto = false

[profile.static-release]
inherits = "release"
lto = true

[profile.static-dev]
inherits = "release"
lto = false

[dependencies]
anyhow = "1.0.104"
arrayvec = { version = "0.7.8", features = ["serde"] }
atomic_float = "1.1.0"
bitcode = { version = "=0.6.9", features = ["arrayvec"] }
blake3 = "1.8.5"
bytesize = "2.4.2"
chrono = "0.4.45"
console = "0.16.4"
crossbeam-queue = "0.3.13"
dashmap = { version = "7.0.0-rc2", features = ["rayon"] }
dotenv = "0.15.0"
env_logger = { version = "0.11.11", features = ["humantime", "color"] }
envy = "0.4.2"
filetime = "0.2.29"
futures = "0.3.33"
figment = { version = "0.10", features = ["json"] }
image = "0.25.10"
image_hasher = "3.1.1"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
kamadak-exif = "0.6.1"
log = { version = "0.4.33", features = ["kv"] }
mini_executor = "2.0.3"
notify = "9.0.0-rc.4"
num_cpus = "1.17.0"
path-clean = "1.0.1"
rand = "0.10.2"
rayon = "1.12.0"
redb = "4.1"
regex = "1.13.1"
regex-syntax = "0.8.11"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "blocking",
    "native-tls",
    "http2",
    "charset",
] }
rocket = { version = "0.5.1", features = ["json"] }
rocket_seek_stream = "0.2.6"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.150"
superconsole = "0.2.0"
terminal_size = "0.4.4"
thumbhash = "0.1.0"
tokio = { version = "1.53.0", features = ["full"] }
tokio-rayon = "2.1.0"
toml = "1.1"
unicode-width = "0.2.2"
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
base64 = "0.22.1"
directories = "6.0.0"
zip = "9.0.0-pre2"
webbrowser = { version = "1.2.1", optional = true }
rust-embed = "8.12.0"
mime_guess = "2.0.5"
ubyte = "0.10.4"
sysinfo = { version = "0.38.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
embed-frontend = []
auto-open-browser = ["dep:webbrowser"]
performance-test = ["dep:sysinfo", "redb/cache_metrics"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "allow", priority = 0 }
